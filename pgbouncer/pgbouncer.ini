;; PgBouncer — multiplexa as conexões de todos os departamentos.
;;
;; Sem isto, cada banco de departamento abre um pool próprio do Prisma
;; (CPUs × 2 + 1 = 5 conexões nesta VPS), mantidas abertas mesmo sem ninguém
;; logado naquele departamento. Com `max_connections = 100` no Postgres, o 19º
;; departamento derrubaria a API para TODOS ao mesmo tempo.

[databases]
;; Curinga de propósito: os bancos de departamento são criados em tempo de
;; execução pelo painel. Listar um a um exigiria recarregar o PgBouncer a cada
;; departamento novo — e esquecer disso deixaria o departamento inacessível
;; sem nenhum erro no provisionamento.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; transaction: a conexão volta ao pool no fim de cada transação, não no fim da
;; sessão. É o que permite muitos clientes sobre poucas conexões reais.
;;
;; Consequência que o código precisa respeitar: nada de estado de sessão
;; (prepared statements, temp tables, LISTEN/NOTIFY). Por isso o Prisma exige
;; `pgbouncer=true` na URL — sem esse parâmetro o erro aparece de forma
;; intermitente e difícil de rastrear, só sob concorrência.
pool_mode = transaction

;; Muitos clientes lógicos...
max_client_conn = 1000
;; ...sobre poucas conexões reais por banco.
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 2
reserve_pool_timeout = 3

;; Devolve conexão ociosa ao Postgres: departamento sem uso não segura recurso.
server_idle_timeout = 60

ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
stats_period = 60

;; Só o usuário da aplicação pode consultar o console do PgBouncer.
admin_users = postgres
stats_users = postgres
